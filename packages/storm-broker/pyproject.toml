[project]
name = "agentstorming-broker"
version = "0.1.0"
description = "Agent Storming credential broker"
requires-python = ">=3.11"
license = "MIT-0"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6",
    "tomli>=2",
    "cryptography>=43",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.scripts]
storm-broker = "storm_broker.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["storm_broker*"]
