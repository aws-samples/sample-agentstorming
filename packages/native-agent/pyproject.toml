[project]
name = "agentstorming-agent"
version = "0.1.0"
description = "Agent Storming native always-on persona-agent runtime"
requires-python = ">=3.11"
license = "MIT-0"
dependencies = [
    "agentstorming-client>=0.1.0",
    "PyYAML>=6",
    "pydantic>=2.7",
    "litellm>=1.55",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
claude-sdk = ["claude-agent-sdk>=0.1"]
# Hosting on Amazon Bedrock AgentCore Runtime (Instances compute type).
agentcore = ["bedrock-agentcore>=1.22", "boto3>=1.34"]
all = [
    "boto3>=1.34", "anthropic>=0.40", "openai>=1.50",
    "claude-agent-sdk>=0.1", "bedrock-agentcore>=1.22",
]

[project.scripts]
agentstorming-agent = "agentstorming_agent.cli:main"
agentstorming-agentcore = "agentstorming_agent.agentcore_app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentstorming_agent*"]
