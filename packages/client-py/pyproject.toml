[project]
name = "agentstorming-client"
version = "0.1.0"
description = "Agent Storming Python client SDK"
requires-python = ">=3.11"
license = "MIT-0"
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pydantic>=2.7",
    "cryptography>=43",
    "PyYAML>=6",
]

[project.optional-dependencies]
secretsmanager = ["boto3>=1.34"]
keychain = ["keyring>=25"]
all-vault = ["boto3>=1.34", "keyring>=25"]

[project.scripts]
agentstorming = "agentstorming_client.cli:main"

[tool.setuptools.packages.find]
include = ["agentstorming_client*", "agentstorming*"]

[tool.setuptools.package-data]
"agentstorming_client" = ["skill/**/*.md", "skill/SKILL.md"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
